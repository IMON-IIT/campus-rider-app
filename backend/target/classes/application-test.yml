spring:
  datasource:
    url: jdbc:h2:mem:jusmartride_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jusmartride:
  security:
    jwt:
      secret: ju_smart_ride_super_secure_jwt_secret_key_minimum_256_bits_length!
      expiration-ms: 3600000
  routing:
    max-detour-ratio: 0.45
    max-extra-distance-meters: 750.0
    max-extra-time-seconds: 240
    stale-location-threshold-seconds: 300
