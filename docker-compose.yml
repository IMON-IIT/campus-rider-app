version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ju-smart-ride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jusmartride}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ju_pgdata:/var/lib/postgresql/data

volumes:
  ju_pgdata:
